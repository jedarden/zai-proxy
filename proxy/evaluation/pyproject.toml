[project]
name = "zai-evaluation"
version = "0.1.0"
description = "Evaluation framework comparing z.ai proxy vs Anthropic API token counts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
zai-eval = "zai_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zai_eval"]
